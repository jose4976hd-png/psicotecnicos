    // --------------------------------------------------------------
    // FUNCIÓN DE COMPARACIÓN INTELIGENTE
    // --------------------------------------------------------------
    function isAnswerCorrect(userAns, correctAns, type, flex = true) {
        if (!userAns || userAns.trim() === "") return false;
        userAns = userAns.toString().trim().toLowerCase();
        let correct = correctAns.toString().trim().toLowerCase();

        // Para numéricos, convertir ambos a número si es posible
        if (type === "num") {
            let numUser = parseFloat(userAns.replace(',', '.'));
            let numCorrect = parseFloat(correct);
            if (!isNaN(numUser) && !isNaN(numCorrect)) {
                return Math.abs(numUser - numCorrect) < 0.001;
            }
            // Si no son números, comparación flexible de string
        }

        // Para choice, la respuesta esperada puede ser letra o texto
        if (type === "choice") {
            // si correct es una letra suelta (a, b, c...)
            if (correct.length === 1 && /[a-z]/.test(correct)) {
                // el usuario puede haber respondido "a) texto" o solo "a"
                if (userAns === correct) return true;
                if (userAns.startsWith(correct + ")")) return true;
                if (userAns.startsWith(correct + " ")) return true;
                return false;
            } else {
                // comparación directa
                return userAns === correct;
            }
        }

        // Para texto libre, eliminamos tildes y espacios
        const normalize = (s) => {
            return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\d]/g, "");
        };
        let userNorm = normalize(userAns);
        let correctNorm = normalize(correct);
        if (userNorm === correctNorm) return true;

        // Casos especiales comunes
        if (correct === "antihorario" && (userAns === "contrario" || userAns === "sentido contrario")) return true;
        if (correct === "reviso" && (userAns.includes("reviso") || userAns.includes("tilde"))) return true;
        if (correct === "maquina" && userAns.includes("maquina")) return true;
        if (correct === "analizo" && userAns.includes("analizo")) return true;
        if (correct === "calor" && (userAns.includes("calor") || userAns.includes("interruptor"))) return true;
        if (correct === "8 horas" && (userAns.includes("8") && (userAns.includes("hora") || userAns.includes("h")))) return true;
        if (correct === "jueves" && userAns === "jueves") return true;
        if (correct === "miércoles" && (userAns === "miercoles" || userAns === "miércoles")) return true;

        return false;
    }

            if (secondsLeft <= 0) {
                stopTimer();
                alert("⏰ TIEMPO FINALIZADO. Corrige tus respuestas.");
            } else {
                secondsLeft--;
                updateTimerDisplay();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        let mins = Math.floor(secondsLeft / 60);
        let secs = secondsLeft % 60;
        document.getElementById("timerDisplay").innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }

    function renderQuestions() {
        const questions = levelMap[currentLevel].questions;
        const container = document.getElementById("questionsContainer");
        container.innerHTML = "";
        userAnswers = {};
        questions.forEach((q, idx) => {
            const qDiv = document.createElement("div");
            qDiv.className = "question-card";
            qDiv.innerHTML = `<div class="question-text">${idx+1}. ${q.text}</div>`;
            const optionsDiv = document.createElement("div");
            optionsDiv.className = "options";
            if (q.type === "choice") {
                q.options.forEach(opt => {
                    const label = document.createElement("label");
                    label.className = "option-label";
                    const radio = document.createElement("input");
                    radio.type = "radio";
                    radio.name = `q${idx}`;
                    radio.value = opt;
                    radio.addEventListener("change", (e) => {
                        if(e.target.checked) userAnswers[idx] = opt;
                        // Quitar selected de otros labels del mismo grupo
                        document.querySelectorAll(`input[name='q${idx}']`).forEach(rb => {
                            rb.closest('.option-label')?.classList.remove('selected');
                        });
                        label.classList.add("selected");
                    });
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(opt));
                    optionsDiv.appendChild(label);
                });
            } else {
                const input = document.createElement("input");
                input.type = "text";
                input.placeholder = "Escribe tu respuesta";
                input.className = "free-text";
                input.addEventListener("input", (e) => { userAnswers[idx] = e.target.value.trim(); });
                optionsDiv.appendChild(input);
            }
            qDiv.appendChild(optionsDiv);
            container.appendChild(qDiv);
        });
        userAnswers = {};
        stopTimer();
        startTimer(maxSeconds);
    }

    function correctExam() {
        const questions = levelMap[currentLevel].questions;
        let correct = 0;
        let total = questions.length;
        let details = [];
        for (let i = 0; i < total; i++) {
            const q = questions[i];
            const userAns = userAnswers[i];
            let isCorrect = false;
            if (userAns !== undefined && userAns !== "") {
                isCorrect = isAnswerCorrect(userAns, q.answer, q.type, q.flex);
            }
            if (isCorrect) correct++;
            let status = isCorrect ? "✅" : "❌";
            let correctShow = q.answer;
            details.push(`${i+1}: ${status} (Correcta: ${correctShow})`);
        }
        const percent = Math.round((correct/total)*100);
        let msg = `📊 Resultado ${levelMap[currentLevel].name}: ${correct}/${total} (${percent}%)\n`;
        if (currentLevel === 'real') msg += `Corte orientativo: 28-30 | Tu nivel: ${correct>=28?"🟢 Aprobado fuerte":correct>=24?"🟡 Zona corte":"🔴 Necesitas práctica"}`;
        else if (currentLevel === 'elite') msg += `Nivel élite: ${correct>=28?"🔥 Muy competitivo":correct>=24?"🟢 Apto con entrenamiento":"🟠 Mejorable"}`;
        else msg += `Masivo: ${correct>=38?"Excelente":correct>=32?"Buen nivel":"Sigue practicando"}`;
        document.getElementById("resultArea").innerHTML = `<div class="results">${msg.replace(/\n/g,"<br>")}<br><br><details><summary>📋 Ver corrección detallada</summary>${details.join("<br>")}</details></div>`;
    }

    function resetAnswers() {
        userAnswers = {};
        // Limpiar inputs y radios
        document.querySelectorAll(".free-text").forEach(inp => inp.value = "");
        document.querySelectorAll("input[type='radio']").forEach(radio => {
            radio.checked = false;
            radio.closest('.option-label')?.classList.remove('selected');
        });
        document.getElementById("resultArea").innerHTML = "";
        // Reiniciar temporizador (opcional: mantener tiempo)
        stopTimer();
        startTimer(maxSeconds);
    }

    function changeLevel(level) {
        currentLevel = level;
        maxSeconds = levelMap[level].timeSec;
        renderQuestions();
        document.getElementById("resultArea").innerHTML = "";
        document.querySelectorAll(".level-btn").forEach(btn => {
            if(btn.getAttribute("data-level") === level) btn.classList.add("active");
            else btn.classList.remove("active");
        });
    }

    // Eventos
    document.getElementById("checkBtn").addEventListener("click", correctExam);
    document.getElementById("resetBtn").addEventListener("click", resetAnswers);
    document.querySelectorAll(".level-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
            changeLevel(e.target.getAttribute("data-level"));
        });
    });
    changeLevel("massive");
</script>
</body>
</html>
